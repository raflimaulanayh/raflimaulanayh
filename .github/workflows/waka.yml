name: WakaTime Metrics

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with dev metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PULL_BRANCH_NAME: 'main'
          PUSH_BRANCH_NAME: 'main'
          SHOW_TOTAL_CODE_TIME: 'True'
          SHOW_AI_CODE_TIME: 'True'
          SHOW_AI_CODING: 'True'
          SHOW_SHORT_INFO: 'True'
          SHOW_COMMIT: 'True'
          SHOW_DAYS_OF_WEEK: 'True'
          SHOW_TIMEZONE: 'True'
          SHOW_LANGUAGE: 'True'
          SHOW_EDITORS: 'True'
          SHOW_OS: 'True'
          SHOW_LINES_OF_CODE: 'True'
          SHOW_LANGUAGE_PER_REPO: 'True'
          SHOW_PROJECTS: 'False'
          SHOW_LOC_CHART: 'False'
          SHOW_PROFILE_VIEWS: 'False'
          SHOW_UPDATED_DATE: 'True'
          UPDATED_DATE_FORMAT: '%d/%m/%Y %H:%M:%S UTC'
          SYMBOL_VERSION: '2'
          LOCALE: 'en'
          COMMIT_MESSAGE: 'chore: update dev metrics'
          COMMIT_SINGLE: 'True'
